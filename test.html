<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplab Test</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Authentication Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-container">
            <div class="auth-form" id="loginForm">
                <div class="auth-header">
                    <div class="logo">
                        <div class="logo-icon">🌊</div>
                        <span class="logo-text">Ripplab</span>
                    </div>
                    <h2>Hoş Geldiniz</h2>
                    <p>Hesabınıza giriş yapın</p>
                </div>
                
                <form class="login-form">
                    <div class="form-group">
                        <label for="loginEmail">E-posta</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Şifre</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Giriş Yap</button>
                </form>
                
                <div class="social-login">
                    <button type="button" class="social-btn facebook-btn" onclick="handleFacebookLogin()">
                        <i class="fab fa-facebook-f"></i>
                        Facebook ile Giriş
                    </button>
                    <button type="button" class="social-btn google-btn" onclick="handleGoogleLogin()">
                        <i class="fab fa-google"></i>
                        Google ile Giriş
                    </button>
                </div>
                
                <p><a href="#" id="showRegister">Kayıt olun</a></p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-app" id="mainApp" style="display: none;">
        <h1>Ana Sayfa</h1>
        <p>Hoş geldiniz!</p>
        <button onclick="logoutUser()">Çıkış Yap</button>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
