<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplab Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .info { background: #e3f2fd; border: 1px solid #2196f3; }
        .success { background: #e8f5e8; border: 1px solid #4caf50; }
        .error { background: #ffebee; border: 1px solid #f44336; }
        .hidden { display: none !important; }
        .auth-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10000; 
        }
        .main-app { 
            display: block; 
            min-height: 100vh; 
            background: #f0f0f0; 
            padding: 20px; 
        }
        .main-app.hidden { display: none !important; }
        .auth-container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            text-align: center; 
        }
        button { 
            padding: 10px 20px; 
            margin: 10px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        .btn-primary { background: #0386f2; color: white; }
        .btn-success { background: #4caf50; color: white; }
    </style>
</head>
<body>
    <h1>🌊 Ripplab Authentication Test</h1>
    
    <div id="authStatus" class="status info">Checking authentication...</div>
    <div id="elementStatus" class="status info">Checking elements...</div>
    
    <div id="authModal" class="auth-modal">
        <div class="auth-container">
            <h2>🔐 Giriş Yapın</h2>
            <p>Test için basit giriş formu</p>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="E-posta" required><br><br>
                <input type="password" id="loginPassword" placeholder="Şifre" required><br><br>
                <button type="submit" class="btn-primary">Giriş Yap</button>
            </form>
            <br>
            <button onclick="testLogin()" class="btn-success">Test Giriş (Otomatik)</button>
        </div>
    </div>
    
    <div id="mainApp" class="main-app hidden">
        <h2>🎉 Hoş Geldiniz!</h2>
        <p>Başarıyla giriş yaptınız!</p>
        <button onclick="logout()" class="btn-primary">Çıkış Yap</button>
    </div>
    
    <div id="consoleLogs" style="background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;">
        <strong>Console Logs:</strong><br>
        <div id="logContent"></div>
    </div>

    <script>
        // Override console.log to show in page
        const originalLog = console.log;
        const logContent = document.getElementById('logContent');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const logLine = document.createElement('div');
            logLine.textContent = args.join(' ');
            logContent.appendChild(logLine);
            logContent.scrollTop = logContent.scrollHeight;
        };
        
        // Test functions
        function testLogin() {
            console.log('🧪 Test login triggered');
            const userData = {
                name: 'Test User',
                email: 'test@example.com',
                type: 'buyer',
                id: Date.now()
            };
            authenticateUser(userData);
        }
        
        function logout() {
            console.log('🚪 Logout triggered');
            logoutUser();
        }
        
        // Authentication functions (simplified)
        let currentUser = null;
        let isAuthenticated = false;
        
        function authenticateUser(userData) {
            console.log('✅ Authenticating user:', userData);
            currentUser = userData;
            isAuthenticated = true;
            
            // Hide auth modal and show main app
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            // Save to localStorage
            localStorage.setItem('ripplab_user', JSON.stringify(userData));
            
            // Update status
            document.getElementById('authStatus').className = 'status success';
            document.getElementById('authStatus').textContent = '✅ Giriş başarılı!';
            
            console.log('🎉 User authenticated successfully');
        }
        
        function logoutUser() {
            console.log('👋 Logging out user');
            currentUser = null;
            isAuthenticated = false;
            
            // Clear localStorage
            localStorage.removeItem('ripplab_user');
            
            // Show auth modal and hide main app
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            
            // Update status
            document.getElementById('authStatus').className = 'status info';
            document.getElementById('authStatus').textContent = '🔐 Çıkış yapıldı, giriş yapın';
            
            console.log('👋 User logged out successfully');
        }
        
        // Check authentication status on load
        function checkAuthStatus() {
            console.log('🔍 Checking authentication status...');
            
            const savedUser = localStorage.getItem('ripplab_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    isAuthenticated = true;
                    console.log('✅ User is already authenticated:', currentUser);
                    
                    // Hide auth modal and show main app
                    document.getElementById('authModal').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    
                    // Update status
                    document.getElementById('authStatus').className = 'status success';
                    document.getElementById('authStatus').textContent = `✅ Hoş geldiniz, ${currentUser.name}!`;
                    
                    return true;
                } catch (error) {
                    console.error('❌ Error parsing saved user data:', error);
                    localStorage.removeItem('ripplab_user');
                    return false;
                }
            } else {
                console.log('👤 No saved user found');
                return false;
            }
        }
        
        // Check elements
        function checkElements() {
            console.log('🔍 Checking DOM elements...');
            
            const elements = {
                authModal: document.getElementById('authModal'),
                mainApp: document.getElementById('mainApp'),
                loginForm: document.getElementById('loginForm')
            };
            
            const missingElements = Object.entries(elements)
                .filter(([name, element]) => !element)
                .map(([name]) => name);
            
            if (missingElements.length > 0) {
                console.error('❌ Missing elements:', missingElements);
                document.getElementById('elementStatus').className = 'status error';
                document.getElementById('elementStatus').textContent = `❌ Eksik elementler: ${missingElements.join(', ')}`;
                return false;
            } else {
                console.log('✅ All elements found');
                document.getElementById('elementStatus').className = 'status success';
                document.getElementById('elementStatus').textContent = '✅ Tüm elementler bulundu';
                return true;
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Page loaded, initializing...');
            
            if (checkElements()) {
                checkAuthStatus();
            }
            
            // Form submission
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('📝 Login form submitted');
                
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (email && password) {
                    const userData = {
                        name: email.split('@')[0],
                        email: email,
                        type: 'buyer',
                        id: Date.now()
                    };
                    authenticateUser(userData);
                } else {
                    alert('Lütfen e-posta ve şifre girin');
                }
            });
            
            console.log('✅ Initialization complete');
        });
    </script>
</body>
</html>
