<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplab Simple Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
        }
        .hidden {
            display: none !important;
        }
        .main-app {
            text-align: center;
            padding: 50px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-primary {
            background: #0386f2;
            color: white;
        }
        .btn-secondary {
            background: #6eafdf;
            color: white;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="debug" style="position: fixed; top: 10px; left: 10px; background: white; padding: 10px; border: 1px solid #ccc; z-index: 10001;">
        <h3>Debug Info</h3>
        <div id="status">Loading...</div>
        <button onclick="testElements()">Test Elements</button>
        <button onclick="showAuth()">Show Auth</button>
        <button onclick="hideAuth()">Hide Auth</button>
    </div>

    <!-- Authentication Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-container">
            <h2>Giriş Yap</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="E-posta" required>
                <input type="password" id="loginPassword" placeholder="Şifre" required>
                <button type="submit" class="btn-primary">Giriş Yap</button>
            </form>
            <button onclick="showRegister()" class="btn-secondary">Kayıt Ol</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="main-app hidden">
        <h1>Hoş Geldiniz!</h1>
        <p>Başarıyla giriş yaptınız.</p>
        <button onclick="logout()" class="btn-secondary">Çıkış Yap</button>
    </div>

    <script>
        // Simple authentication system
        let isAuthenticated = false;
        let currentUser = null;

        // DOM elements
        const authModal = document.getElementById('authModal');
        const mainApp = document.getElementById('mainApp');
        const loginForm = document.getElementById('loginForm');
        const statusDiv = document.getElementById('status');

        // Update debug info
        function updateStatus() {
            statusDiv.innerHTML = `
                <div>Auth Modal: ${authModal ? '✓' : '✗'}</div>
                <div>Main App: ${mainApp ? '✓' : '✗'}</div>
                <div>Login Form: ${loginForm ? '✓' : '✗'}</div>
                <div>Authenticated: ${isAuthenticated ? '✓' : '✗'}</div>
                <div>User: ${currentUser ? currentUser.name : 'None'}</div>
            `;
        }

        // Show authentication modal
        function showAuth() {
            console.log('Showing auth modal');
            if (authModal && mainApp) {
                authModal.classList.remove('hidden');
                mainApp.classList.add('hidden');
                console.log('Auth modal shown');
            }
        }

        // Hide authentication modal
        function hideAuth() {
            console.log('Hiding auth modal');
            if (authModal && mainApp) {
                authModal.classList.add('hidden');
                mainApp.classList.remove('hidden');
                console.log('Main app shown');
            }
        }

        // Show register form (placeholder)
        function showRegister() {
            alert('Kayıt formu burada olacak');
        }

        // Login handler
        function handleLogin(event) {
            event.preventDefault();
            console.log('Login attempt');
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (email && password) {
                // Simulate login
                currentUser = { name: email.split('@')[0], email: email };
                isAuthenticated = true;
                
                // Hide auth modal and show main app
                hideAuth();
                
                // Save to localStorage
                localStorage.setItem('ripplab_user', JSON.stringify(currentUser));
                
                console.log('Login successful:', currentUser);
                updateStatus();
            }
        }

        // Logout handler
        function logout() {
            console.log('Logging out');
            currentUser = null;
            isAuthenticated = false;
            
            // Clear localStorage
            localStorage.removeItem('ripplab_user');
            
            // Show auth modal
            showAuth();
            
            console.log('Logout successful');
            updateStatus();
        }

        // Test elements function
        function testElements() {
            console.log('Testing elements:');
            console.log('authModal:', authModal);
            console.log('mainApp:', mainApp);
            console.log('loginForm:', loginForm);
            console.log('isAuthenticated:', isAuthenticated);
            console.log('currentUser:', currentUser);
        }

        // Check if user is already logged in
        function checkAuthStatus() {
            const savedUser = localStorage.getItem('ripplab_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    isAuthenticated = true;
                    hideAuth(); // Show main app
                    console.log('User already authenticated:', currentUser);
                } catch (error) {
                    console.error('Error parsing saved user:', error);
                    localStorage.removeItem('ripplab_user');
                }
            } else {
                showAuth(); // Show auth modal
                console.log('No saved user, showing auth modal');
            }
            updateStatus();
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing...');
            checkAuthStatus();
            
            // Add event listeners
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
                console.log('Login form event listener added');
            }
            
            console.log('Initialization complete');
        });

        // Update status every second
        setInterval(updateStatus, 1000);
        
        // Initial status update
        updateStatus();
        
        console.log('Simple test script loaded');
    </script>
</body>
</html>
